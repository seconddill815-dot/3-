<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 года вместе!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('bg.jpeg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            text-align: center;
            position: relative;
        }
        /* Мерцающие звезды */
        .star {
            position: fixed;
            background-color: #fff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            animation: blink infinite ease-in-out;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .container {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            padding: 45px 25px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            max-width: 550px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.25);
            z-index: 2;
            animation: fadeIn 2s ease-in-out;
        }
        .slider-container {
            width: 220px;
            height: 220px;
            margin: 0 auto 30px;
            border-radius: 50%;
            border: 5px solid #ff4d6d;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            position: relative;
        }
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .slide.active {
            opacity: 1;
        }
        h1 {
            font-size: 3.2rem; 
            margin-bottom: 20px; 
            color: #ff4d6d;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
        }
        .main-text {
            font-size: 1.7rem; 
            line-height: 1.8; 
            font-weight: bold; 
            margin-bottom: 25px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
        }
        .sub-text {
            font-size: 1.5rem; 
            line-height: 1.7; 
            margin-bottom: 30px; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }
        .green-text {
            color: #4ade80; 
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        .heart-btn {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 5px 20px rgba(255, 77, 109, 0.5);
            font-weight: bold;
        }
        .heart-btn:hover {
            background: #ff758f;
            transform: scale(1.05);
        }
        .music-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 77, 109, 0.8);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 10;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            transition: background 0.3s;
        }
        .music-toggle:hover {
            background: rgba(255, 117, 143, 0.9);
        }
        .heart {
            position: fixed;
            color: #ff4d6d;
            position: absolute;
            top: -10%;
            z-index: 1;
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to {
                transform: translateY(110vh) translateX(120px) rotate(360deg);
                opacity: 0;
            }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <audio id="bg-music" src="mot.mp3" loop></audio>
    <button class="music-toggle" id="music-btn" onclick="toggleMusic()">🎵 Звук: Выкл</button>

    <div class="container">
        <!-- Слайдер со смешанными форматами -->
        <div class="slider-container">
            <img src="p1.jpeg" class="slide active" alt="Фото 1">
            <img src="p2.jpeg" class="slide" alt="Фото 2">
            <img src="p3.jpeg" class="slide" alt="Фото 3">
            <img src="p4.jpeg" class="slide" alt="Фото 4">
            <img src="p5.dng" class="slide" alt="Фото 5">
            <img src="p6.dng" class="slide" alt="Фото 6">
            <img src="p7.dng" class="slide" alt="Фото 7">
            <img src="p8.dng" class="slide" alt="Фото 8">
            <img src="p9.jpeg" class="slide" alt="Фото 9">
            <img src="p10.dng" class="slide" alt="Фото 10">
        </div>
        
        <h1>3 года вместе!</h1>
        
        <p class="main-text">
            Спасибо за наше знакомство! <br>
            Оно невероятное и дано нам судьбой... ☺️🥰💋🍓🫂💦
        </p>
        
        <p class="sub-text">
            Спасибо за эти три года, проведенных вместе. Очень тебя люблю! 😍 <br>
            <span class="green-text">Дальше — больше 💚</span>
        </p>
        
        <button class="heart-btn" onclick="burstHearts()">Нажми меня ❤️</button>
    </div>

    <script>
        // --- Генератор звезд ---
        function createStars() {
            for (let i = 0; i < 40; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.animationDuration = Math.random() * 3 + 1.5 + 's';
                star.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(star);
            }
        }
        createStars();

        // Музыкальный плеер
        const music = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-btn');

        document.body.addEventListener('click', () => {
            if (music.paused) {
                music.play().then(() => {
                    musicBtn.innerHTML = '🎵 Звук: Вкл';
                }).catch(e => console.log("Блокировка звука"));
            }
        }, { once: true });

        function toggleMusic() {
            if (music.paused) {
                music.play();
                musicBtn.innerHTML = '🎵 Звук: Вкл';
            } else {
                music.pause();
                musicBtn.innerHTML = '🎵 Звук: Выкл';
            }
        }

        // Логика слайдера
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;

        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }
        setInterval(nextSlide, 3000);

        // Падающие сердечки
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            heart.style.fontSize = Math.random() * 25 + 15 + 'px';
            heart.style.opacity = Math.random() * 0.6 + 0.4;
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }
        setInterval(createHeart, 350);

        function burstHearts() {
            for(let i = 0; i < 20; i++) {
                setTimeout(createHeart, i * 80);
            }
        }
    </script>
</body>
</html>
